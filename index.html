<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lombard xizmatlarini baholash</title>
    <style>
        :root {
            --primary-color: #003366; /* To'q ko'k rang */
            --accent-color: #D4AF37; /* Oltin rang */
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 700px;
            background: white;
            padding: 40px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--accent-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header img {
            max-width: 200px;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.intro {
            font-size: 14px;
            color: #666;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border 0.3s;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .radio-group, .checkbox-group {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
        }

        .option-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .option-item input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option-item label {
            margin-bottom: 0;
            font-weight: normal;
            color: #333;
            cursor: pointer;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #002244;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: var(--primary-color);
            font-weight: bold;
        }

        .success-message {
            display: none;
            text-align: center;
            color: green;
            padding: 20px;
            background: #e6fffa;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid green;
        }

        .error-message {
            display: none;
            text-align: center;
            color: red;
            background: #ffe6e6;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid red;
        }
        
        /* Limit text style */
        .limit-info {
            text-align: right;
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>

<script>
    // YANGI UPDATE: Limit 10taga oshirildi
    const MAX_SUBMISSIONS_PER_DAY = 10;
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxZxUB7fEZyovOK0aFtpTGa9DSye8AYTi20hWbY6AfmQvjiausjmoqgLvN_qOj5K6xi/exec';

    // 1. IP Manzilni aniqlash
    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
            document.getElementById('userIP').value = data.ip;
            checkRateLimit();
        })
        .catch(error => console.log('IP aniqlanmadi', error));

    function checkRateLimit() {
        const today = new Date().toDateString();
        const storedDate = localStorage.getItem('lastSubmissionDate');
        let count = parseInt(localStorage.getItem('submissionCount')) || 0;

        // Agar sana o'zgargan bo'lsa, hisoblagichni yangilaymiz
        if (storedDate !== today) {
            count = 0;
            localStorage.setItem('lastSubmissionDate', today);
            localStorage.setItem('submissionCount', 0);
        }

        const remaining = MAX_SUBMISSIONS_PER_DAY - count;
        
        if (count >= MAX_SUBMISSIONS_PER_DAY) {
            document.getElementById('lombardForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('successMessage').innerHTML = '<h2>Limit tugadi</h2><p>Siz bugun limitdan (10 marta) foydalanib bo\'ldingiz.</p>';
        } else {
            document.getElementById('limitInfo').innerText = `Bugungi qolgan urinishlar soni: ${remaining} ta (Test rejimi)`;
        }
    }

    const form = document.forms['lombardForm'];
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const successMsg = document.getElementById('successMessage');
    const errorMsg = document.getElementById('errorMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        // Limitni qayta tekshirish (bosishdan oldin)
        let count = parseInt(localStorage.getItem('submissionCount')) || 0;
        if (count >= MAX_SUBMISSIONS_PER_DAY) {
            alert("Limit tugadi!");
            return;
        }

        // Checkboxlar uchun maxsus yig'ish (Sabab)
        const formData = new FormData(form);
        const sabablar = [];
        document.querySelectorAll('input[name="Sabab"]:checked').forEach((checkbox) => {
            sabablar.push(checkbox.value);
        });
        formData.set('Sabab', sabablar.join(", "));

        submitBtn.disabled = true;
        submitBtn.style.display = 'none';
        loading.style.display = 'block';
        errorMsg.style.display = 'none';

        fetch(scriptURL, { method: 'POST', body: formData})
            .then(response => {
                loading.style.display = 'none';
                form.style.display = 'none';
                successMsg.style.display = 'block';
                
                // Muvaffaqiyatli bo'lsa hisoblagichni oshiramiz
                let currentCount = parseInt(localStorage.getItem('submissionCount')) || 0;
                localStorage.setItem('submissionCount', currentCount + 1);
                localStorage.setItem('lastSubmissionDate', new Date().toDateString());
            })
            .catch(error => {
                console.error('Error!', error.message);
                loading.style.display = 'none';
                submitBtn.style.display = 'block';
                submitBtn.disabled = false;
                errorMsg.style.display = 'block';
                errorMsg.innerText = "Xatolik: " + error.message;
            });
    });
</script>
